[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co3085-course-assistant"
version = "1.0.0"
description = "A classical, grammar-driven NLP course assistant for CO3085"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
course-assistant = "hcmut.iaslab.nlp.app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

